name: ML Workflow CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job & Run actions/checkout@v3
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 pandas scikit-learn==1.5.2

      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          cd MLProject
          RUN_ID=$(cat run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Ditemukan Run ID: $RUN_ID"

      - name: Install Python dependencies
        run: echo "Dependensi sudah terinstal di tahap sebelumnya."

      - name: Upload to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/mlruns/
          git commit -m "Upload artefak model melalui GitHub Actions [skip ci]" || echo "Tidak ada perubahan"
          git push

      - name: Build Docker Model
        run: |
          cd MLProject
          echo "Menjalankan mlflow models build-docker secara manual"
          mlflow models generate-dockerfile -m "runs:/${{ env.RUN_ID }}/model" -d docker_build_dir --env-manager=virtualenv
          sed -i 's|https://bootstrap.pypa.io/get-pip.py|https://bootstrap.pypa.io/pip/3.9/get-pip.py|g' docker_build_dir/Dockerfile
          docker build -t la-liga-model:latest docker_build_dir/

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag Docker Image
        run: |
          docker tag la-liga-model:latest ${{ secrets.DOCKER_USERNAME }}/la-liga-model:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/la-liga-model:latest